<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>考研政治全真模拟 785 题 · 题库</title>
<meta name="description" content="考研政治全真模拟题库：题目、解析（原页截图）、知识清单与速成班讲义对照、手写笔记、云端同步">
<link rel="stylesheet" href="css/app.css?v=73">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>📕</text></svg>">
</head>
<body>
<header id="topbar">
  <div class="row">
    <button class="iconbtn" onclick="ZS_BACK()" title="返回上一页">‹</button>
    <span class="brand">📕 720题题库</span>
    <span class="sp"></span>
    <button class="iconbtn" onclick="ZS_GO('')">🏠 首页</button>
    <button class="iconbtn" onclick="ZS_GO('s')">🔍</button>
    <button class="iconbtn on" id="annoVis" onclick="ZS_ANNOVIS()">👁</button>
    <button class="iconbtn" onclick="ZS_GO('me')">☁️</button>
  </div>
</header>
<main class="wrap" id="view"><div class="empty">加载中…</div></main>
<div id="qfab">
  <button id="qfabPrev" onclick="ZS_QNAV(-1)" title="上一题">‹</button>
  <button id="qfabNext" onclick="ZS_QNAV(1)" title="下一题">›</button>
</div>
<div id="qnav">
  <button class="iconbtn" id="qnavPrev" onclick="ZS_QNAV(-1)">‹ 上一题</button>
  <span id="qnavInfo"></span>
  <button class="iconbtn" id="qnavRedo" onclick="ZS_QNAVREDO()">🔄 重做</button>
  <button class="iconbtn" id="qnavNext" onclick="ZS_QNAV(1)">下一题 ›</button>
</div>
<div id="annobar"></div>
<div id="modal"></div>
<div id="toast"></div>
<nav id="tabbar">
  <button data-go=""><b>🏠</b>首页</button>
  <button data-go="queue"><b>🗂</b>队列<span id="qbadge" class="qbadge"></span></button>
  <button data-go="s"><b>🔍</b>搜索</button>
  <button data-go="me"><b>☁️</b>我的</button>
</nav>
<script>
window.addEventListener('error', e=>{
  var d=document.getElementById('errbox')||document.createElement('div');
  d.id='errbox'; d.style.cssText='position:fixed;left:8px;right:8px;top:64px;z-index:999;background:#fdecea;color:#c0392b;border:1px solid #f5c6c0;border-radius:10px;padding:8px 10px;font-size:12px;white-space:pre-wrap';
  d.textContent='⚠️ '+e.message+' @'+String(e.filename||'').split('/').pop()+':'+e.lineno;
  document.body.appendChild(d);
});
</script>
<script src="js/store.js?v=73"></script>
<script src="js/annotate.js?v=73"></script>
<script src="js/app.js?v=73"></script>
<script>
document.querySelectorAll('#tabbar button').forEach(b=>b.onclick=()=>ZS_GO(b.dataset.go));
// 高亮当前 tab
const mark=()=>{const h=location.hash.replace(/^#\/?/,'').split('/')[0];
 document.querySelectorAll('#tabbar button').forEach(b=>b.classList.toggle('on',b.dataset.go===h));};
window.addEventListener('hashchange',mark);mark();
</script>
</body>
</html>
